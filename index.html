<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MCTiers Rebirth</title>
  <meta name="description" content="MCTiers Rebirth tier list: rankings for every tested player.">
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Russo+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#overall" aria-label="MCTiers Rebirth home">
        <img src="assets/logo.png" alt="" class="brand-logo">
        <span class="brand-text">MCTIERS <span>REBIRTH</span></span>
      </a>
      <nav class="nav">
        <a href="#overall" class="nav-link nav-home"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
        <a href="#overall" class="nav-link"><svg viewBox="0 0 24 24"><path d="M7 4h10v3a5 5 0 0 1-10 0zM7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3M12 12v4M8 20h8M9 16h6v4H9z"/></svg>Rankings</a>
        <a href="#" class="nav-link" id="discordLink" hidden target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M8 5c-2 .4-3.4 1-4.6 2C2.2 10 2 13 2.2 16.4 3.8 17.6 5.4 18.4 7 19l1.2-2M16 5c2 .4 3.4 1 4.6 2 1.2 3 1.4 6 1.2 9.4-1.6 1.2-3.2 2-4.8 2.6l-1.2-2M6.5 16.5c3.5 1.6 7.5 1.6 11 0M9 12.5h.01M15 12.5h.01"/></svg>Discord</a>
        <a href="terms.html" class="nav-link"><svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8zM14 3v5h5M9 13h6M9 17h6"/></svg>Rules &amp; Terms</a>
      </nav>
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="search" type="search" placeholder="Search player..." autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
        <ul class="search-results" id="searchResults" hidden></ul>
      </label>
    </header>

    <main>
      <div class="tabs" id="tabs" role="tablist"></div>
      <section class="board">
        <div class="board-top">
          <span class="updated" id="updated"></span>
          <button class="info-btn" id="infoBtn" type="button">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" class="fill"/><path d="M12 11v6M12 7.5v.01" class="cut"/></svg>
            Information
          </button>
        </div>
        <div id="view"></div>
      </section>
    </main>

    <footer class="footer">
      MCTiers Rebirth is not affiliated with MCTiers, Mojang Studios or Microsoft.
      <a href="terms.html">Terms of Service</a> <a href="privacy.html">Privacy Policy</a>
    </footer>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" type="button" aria-label="Close">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
